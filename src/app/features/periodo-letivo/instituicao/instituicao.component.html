  <header class="page-header">

  @if (!instituicao.instituicao()) {

  <form class="card" (submit)="salvar($event)">
    <div class="card-body">
      <div class="form-grid">
        <div class="span-2">
          <label class="form-label" for="inst-nome">Nome da instituiÃ§Ã£o *</label>
          <input
            id="inst-nome"

        <div>

          <datalist id="fusos-instituicao">
