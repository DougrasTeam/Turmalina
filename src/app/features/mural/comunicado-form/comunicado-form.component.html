<app-modal [open]="open()" title="Novo comunicado" (close)="fechar()">
  <form (submit)="salvar($event)">
    <div class="form-grid">
      <div class="span-2">
        <label class="form-label" for="comunicado-aluno">Destinatário</label>
        <input
          id="comunicado-aluno"
          class="form-control"
          type="text"
          [value]="aluno()?.nome ?? ''"
          readonly
        />
      </div>

      <div class="span-2">
        <label class="form-label" for="comunicado-tipo">Tipo</label>
        <select
          id="comunicado-tipo"
          class="form-select"
          [value]="form().tipo"
          (change)="setTipo($event)"
        >
          @for (tipo of tipos; track tipo.value) {
            <option [value]="tipo.value">{{ tipo.label }}</option>
          }
        </select>
        <p class="form-text">
          <span class="material-symbols-outlined" aria-hidden="true">{{ tipoAtual().icone }}</span>
          {{ tipoAtual().descricao }}
        </p>
      </div>

      <div class="span-2">
        <label class="form-label" for="comunicado-titulo">Título *</label>
        <input
          id="comunicado-titulo"
          class="form-control"
          type="text"
          [attr.maxlength]="tituloMax"
          placeholder="Ex.: Parabéns pelo desempenho"
          [value]="form().titulo"
          (input)="patch('titulo', valor($event))"
        />
      </div>

      <div class="span-2">
        <label class="form-label" for="comunicado-conteudo">Conteúdo *</label>
        <textarea
          id="comunicado-conteudo"
          class="form-control"
          rows="5"
          [attr.maxlength]="conteudoMax"
          placeholder="Escreva a mensagem"
          [value]="form().conteudo"
          (input)="patch('conteudo', valor($event))"
        ></textarea>
      </div>
    </div>

    <div class="d-flex justify-content-between gap-2 mt-3">
      <button class="btn btn-light" type="button" (click)="fechar()">Cancelar</button>
      <button class="btn btn-primary" type="submit">
        {{ form().tipo === 'recado' ? 'Enviar recado' : 'Registrar observação' }}
      </button>
    </div>
  </form>
</app-modal>
