<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>turmaLina</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0FF;--ink:#1B1740;--ink2:#5F5B86;--pri:#5B3DF5;--pri-d:#3F27C4;--coin:#FFC93C;--coin-d:#D99E00;--ok:#19B37D;--ok-d:#0E8A62;--bad:#FF5E6C;--line:#D9D6F2;--card:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;background:var(--bg);color:var(--ink);padding-bottom:96px;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.35}
h1,h2,h3,.disp{font-family:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;letter-spacing:.3px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;gap:12px}
.top small{display:block;color:#B9B4F0;font-size:13px}
.top h1{font-size:26px;line-height:1.1}
.turmabtn{border:0;background:none;color:inherit;text-align:left;padding:0;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:none;object-fit:contain}
.turmabtn h1::after{content:" \25BE";font-size:16px;opacity:.7}
.tools{display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:14px;border:0;background:#2E2870;font-size:22px;box-shadow:0 3px 0 #120E33}
.ib:active{transform:translateY(3px);box-shadow:none}.ib[data-a="aparencia"] .material-symbols-rounded{color:#FFD166}.ib[data-a="sorteio"] .material-symbols-rounded{color:#FF8DB7}.ib[data-a="telao"] .material-symbols-rounded{color:#78D9FF}
main{max-width:760px;margin:0 auto;padding:16px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{position:relative;flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12.5px;color:var(--ink2);min-width:0}
.tabs button span.i{font-size:23px;line-height:1}.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;vertical-align:middle}.tabs .material-symbols-rounded{font-size:23px}.tile .material-symbols-rounded{font-size:30px}.menu .material-symbols-rounded{font-size:30px;width:40px;text-align:center}.ib .material-symbols-rounded{font-size:24px}
/* Ícones Material com cores lúdicas e consistentes */
.ib .material-symbols-rounded{color:#C9C3FF}
.tabs button:nth-child(1) .i{color:#6C63FF}.tabs button:nth-child(2) .i{color:#F06AA8}.tabs button:nth-child(3) .i{color:#18A878}.tabs button:nth-child(4) .i{color:#F0A51B}.tabs button:nth-child(5) .i{color:#4388E8}.tabs button:nth-child(6) .i{color:#8B5CF6}
.tabs button.on .i{color:#fff}
.tile .e,.menu .e{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:15px;background:#F0EDFF;color:#6554E8;line-height:1}
.tile:nth-child(6n+2) .e,.menu:nth-child(6n+2) .e{background:#FFE8F1;color:#D94686}
.tile:nth-child(6n+3) .e,.menu:nth-child(6n+3) .e{background:#E1F8ED;color:#13875D}
.tile:nth-child(6n+4) .e,.menu:nth-child(6n+4) .e{background:#FFF2D6;color:#B97700}
.tile:nth-child(6n+5) .e,.menu:nth-child(6n+5) .e{background:#E4F0FF;color:#3478D4}
.tile:nth-child(6n) .e,.menu:nth-child(6n) .e{background:#FBE8DF;color:#C65C36}
.tile .material-symbols-rounded,.menu .material-symbols-rounded{font-variation-settings:'FILL' 1;}
.tabs button.on{background:var(--pri);color:#fff}
.tabs .nb{position:absolute;top:0;right:10px;background:var(--ok);color:#fff;border-radius:99px;font-size:11px;min-width:18px;line-height:18px;padding:0 4px;border:2px solid #fff}

.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:10px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border-radius:12px;padding:12px 18px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--pri);border-color:var(--pri-d);color:#fff;box-shadow:0 4px 0 var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok-d);color:#fff;box-shadow:0 4px 0 var(--ok-d)}
.btn.coin{background:var(--coin);border-color:var(--coin-d);box-shadow:0 4px 0 var(--coin-d)}
.btn.bad{color:#C2283A;border-color:#FFC3C9;box-shadow:0 3px 0 #FFC3C9}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.big{width:100%;font-size:18px;padding:14px}
.mini{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.row{display:flex;gap:10px;margin-top:16px}
.row>*{flex:1}
.sec-t{font-size:22px;margin:26px 0 10px}
.muted{color:var(--ink2);font-size:14px;font-weight:600;margin:4px 0}
.backl{border:0;background:none;color:var(--pri);font-weight:800;padding:2px 0;margin-bottom:10px;font-size:16px}

.list{display:flex;flex-direction:column;gap:10px}
.aluno,.eq{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 14px 10px 10px}
.aluno:active{transform:translateY(2px);border-bottom-width:3px}
.pos{width:30px;text-align:center;font-family:'Lilita One',system-ui;font-size:20px;color:var(--ink2);flex:none}
.av{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;font-family:'Lilita One',system-ui;font-size:21px;flex:none;border:3px solid rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(27,23,64,.12)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--ink2);font-weight:700}
.bar{height:10px;border-radius:99px;background:#E7E5FA;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coin),#FFA928);border-radius:99px;transition:width .5s}
.bar.g i{background:var(--ok)}
.xp{text-align:right;flex:none;font-size:13px;color:var(--ink2)}
.xp b{display:block;font-family:'Lilita One',system-ui;font-weight:400;font-size:26px;color:var(--ink);line-height:1}
.xp small{display:block;font-size:15px;margin-top:2px;letter-spacing:1px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;color:#fff;margin-left:6px;vertical-align:1px}
.tag.alerta{background:#E0384A}
.eq{border-left:10px solid var(--c);align-items:center}
.eq .emo{font-size:32px}
.eq b.t{font-size:19px;font-family:'Lilita One',system-ui;font-weight:400}

.sp{display:inline-block;border-radius:99px;padding:2px 11px;font-size:13px;font-weight:800;white-space:nowrap}
.sp.ok{background:#D7F5E8;color:#0A6A4B}
.sp.done{background:#E4E0FF;color:#3F27C4}
.sp.wip{background:#EEEDF7;color:var(--ink2)}
.aviso{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#D7F5E8;border:2px solid var(--ok);border-bottom-width:5px;border-radius:18px;padding:12px 14px;margin-bottom:14px;color:#0A5A40}
.aviso .e{font-size:30px}

.grp{margin-bottom:14px}
.grp-h{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:var(--c);color:#fff;border-radius:12px;padding:8px 14px;margin-bottom:8px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.grp-h small{font-weight:700;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:800;font-size:15px}
.chip .av{width:30px;height:30px;font-size:14px;border-width:2px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on::after{content:"✓";color:var(--coin);margin-left:2px}
.chip.eqc{padding:8px 16px;font-size:17px}
.acoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acao{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;text-align:center}
.acao:active{transform:translateY(3px);border-bottom-width:2px}
.acao .e{font-size:30px}
.acao .sub{font-size:12px}
.pill{background:var(--coin);color:var(--ink);border-radius:99px;padding:1px 10px;font-size:14px;font-weight:800}
.gam-kind{display:inline-flex;align-items:center;gap:5px;width:max-content;margin-top:5px;padding:3px 9px;border-radius:999px;background:#E5EEFF;border:1px solid #B7D0FF;color:#244D9A;font-size:11px;font-weight:900;letter-spacing:.35px;text-transform:uppercase;line-height:1.2}
.gam-kind::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.gam-kind-meta{background:#FFF3D6;border-color:#F4D28B;color:#8A5700}
.gam-reward{display:inline-flex;align-items:center;gap:5px;width:max-content;margin-top:5px;padding:4px 10px;border-radius:9px;background:#FFF5D9;border:1px solid #F2D48B;color:#805000;font-size:12px;font-weight:900;line-height:1.2;white-space:nowrap}
.gam-item-main{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.gam-item-main>b{overflow-wrap:anywhere}
.pill.neg{background:var(--bad);color:#fff}
.float{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:19;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 22px;box-shadow:0 4px 0 #0c0925;white-space:nowrap}
.float.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.custom{display:flex;gap:8px;margin-top:12px}
.custom input{flex:1}

.card{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;margin-bottom:12px}
.card.done{opacity:.6}
.card h3{font-size:20px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:16px 10px}
.badge .e{font-size:44px;line-height:1}
.badge b{font-size:17px}
.meta{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px;margin-top:10px}
.meta .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
/* Metas do perfil do aluno: progresso visual, sem badges desalinhadas */
.student-goal{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px;margin-top:10px}
.student-goal-head{display:flex;align-items:center;gap:9px;min-width:0}
.student-goal-icon{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;background:#FFF0C2;font-size:21px}
.student-goal-info{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0}
.student-goal-info b{font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.student-goal-info small{font-size:12px;color:var(--muted,#687386)}
.student-goal-pct{flex:none;font-weight:900;font-size:17px;color:var(--ink)}
.student-goal-track{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 7px}
.student-goal-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#F7B731,#F08A24);transition:width .35s ease}
.student-goal-fill.complete{background:linear-gradient(90deg,#34C98A,#159B68)}
.student-goal-status{font-size:13px;font-weight:800;color:#A65A00}
.student-goal-status.complete{color:#128052}
.student-goal-steps{display:grid;gap:5px;margin-top:10px}
.student-goal-step{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg,#F5F6FA);border-radius:9px;padding:7px 9px;font-size:12px}
.student-goal-step span{min-width:0;overflow-wrap:anywhere}
.student-goal-step b{flex:none;font-variant-numeric:tabular-nums}
.part{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px;margin-top:8px}
.part .bar{grid-column:1/-1}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.stp .q{display:flex;align-items:center;gap:6px}
.stp .q button{width:40px;height:40px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;font-size:20px;line-height:1}
.stp .q button:active{transform:translateY(2px)}
.stp .q b{min-width:30px;text-align:center;font-family:'Lilita One',system-ui;font-weight:400;font-size:22px}

/* menu "Mais" */
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;margin-bottom:10px}
.menu:active{transform:translateY(2px);border-bottom-width:3px}
.menu .e{font-size:30px;width:40px;text-align:center}
.menu .nb2{background:var(--ok);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px}

/* presença, notas, relatório */
.pr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px 8px 8px;background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:8px}
.st{border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:14px;min-width:108px;border-bottom:3px solid rgba(0,0,0,.18);flex:none}
.st:active{transform:translateY(2px)}
.st.P{background:#D7F5E8;color:#0A6A4B}
.st.F{background:#FFDDE0;color:#B01E32}
.st.J{background:#FFEFC2;color:#7A5200}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.k{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:10px 12px}
.k b{display:block;font-family:'Lilita One',system-ui;font-weight:400;font-size:26px;line-height:1.15}
.k span{font-size:13px;color:var(--ink2)}
.k.warn{border-color:var(--bad)}
.nota{font-family:'Lilita One',system-ui;font-size:26px;line-height:1;flex:none}
.nota.ok{color:var(--ok-d)}
.nota.bad{color:#E0384A}
.nin{width:96px;text-align:center;flex:none}

label.f{display:block;margin-top:12px}
label.f span{display:block;font-size:14px;color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=color]{padding:3px;height:46px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
textarea{min-height:110px;resize:vertical}
label.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.arow select{width:auto;max-width:150px;padding:8px}
.arow .nm{flex:1}
.arow .info{flex:1}
.x{border:0;background:none;font-size:20px;padding:6px;color:var(--ink2)}

.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.back{position:absolute;inset:0;background:rgba(27,23,64,.6)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet h2{font-size:26px;margin-bottom:6px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:26px}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.s-out{margin:18px 0;min-height:90px;display:grid;place-items:center;text-align:center;font-family:'Lilita One',system-ui;font-size:44px;background:#fff;border:3px dashed var(--pri);border-radius:20px;padding:10px;word-break:break-word}

#toast{position:fixed;left:12px;right:12px;bottom:88px;z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast div{pointer-events:auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;max-width:520px;box-shadow:0 5px 0 #0c0925;animation:up .2s}
#toast button{border:0;background:var(--coin);color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:800}

#celebra{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(27,23,64,.82);overflow:hidden}
.cel{position:relative;background:var(--coin);border:5px solid var(--ink);border-radius:30px;padding:28px 30px;text-align:center;max-width:90vw;box-shadow:0 10px 0 var(--ink);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.cel.un{background:var(--ok);color:#fff}
.cel .big{font-size:64px;line-height:1}
.cel h2{font-size:36px;margin:6px 0}
.cel p{margin:6px 0;font-size:20px;font-weight:800}
.cel p small{display:block;font-size:15px;font-weight:700}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.conf{position:absolute;top:-20px;left:var(--x);width:10px;height:16px;background:var(--c);border-radius:2px;animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}

#telao{position:fixed;inset:0;z-index:70;background:#14103A;color:#fff;overflow:auto;padding:28px clamp(18px,5vw,64px)}
.tl-x{position:fixed;top:14px;right:14px;border:0;background:#2E2870;color:#fff;width:46px;height:46px;border-radius:14px;font-size:20px}
.tl-t{font-size:clamp(34px,6vw,64px);color:var(--coin);margin-bottom:22px}
.tl-row{display:grid;grid-template-columns:minmax(120px,22%) 1fr 90px;gap:14px;align-items:center;margin-bottom:14px;font-size:clamp(20px,3vw,34px)}
.tl-bar{height:clamp(26px,4vw,44px);background:#2A2460;border-radius:99px;overflow:hidden}
.tl-bar i{display:block;height:100%;border-radius:99px;transition:width .8s}
.tl-row b{font-family:'Lilita One',system-ui;font-weight:400;text-align:right}
.tl-turma{display:grid;grid-template-columns:minmax(150px,34%) 1fr 90px;gap:14px;align-items:center;width:100%;background:#221C57;border:0;border-radius:18px;padding:14px 18px;margin-bottom:12px;color:#fff;text-align:left;font-size:clamp(20px,3vw,32px);font-weight:800}
.tl-turma small{display:block;font-size:14px;color:#B9B4F0;font-weight:700}
.tl-turma b{font-family:'Lilita One',system-ui;font-weight:400;text-align:right}
.tl-p{color:#B9B4F0;font-size:14px}
.tl-vazio{text-align:center;padding:70px 10px;color:#fff}
.tl-vazio .e{font-size:64px}
.tl-vazio h3{font-size:28px;margin:10px 0 6px}
.tl-vazio p{color:#B9B4F0;margin:0 0 18px}
@media(max-width:560px){.tl-turma{grid-template-columns:1fr auto}.tl-turma .tl-bar{grid-column:1/-1;order:3}}

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = n => String(Math.round(n * 100) / 100).replace('.', ',');
const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? 0 : n; };
const quando = ts => new Date(ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dataBR = s => new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- dados padrão ---------- */
const CORES = ['#FF5E6C','#3D7BFF','#19B37D','#F5A623','#9B5CF6','#14B8C4'];
const EQ_PADRAO = [
  {nome:'Fênix', emoji:'🔥', cor:'#FF5E6C'}, {nome:'Lobos', emoji:'🐺', cor:'#3D7BFF'},
  {nome:'Dragões', emoji:'🐉', cor:'#19B37D'}, {nome:'Raios', emoji:'⚡', cor:'#F5A623'}];
const CONQ_PADRAO = [
  {nome:'Ajudante', emoji:'🤝', desc:'Ajudou colegas sem ser pedido', xp:10},
  {nome:'Curioso', emoji:'🔍', desc:'Fez uma pergunta que fez a turma pensar', xp:10},
  {nome:'Pontual', emoji:'⏰', desc:'Chegou e entregou no prazo', xp:10},
  {nome:'Criativo', emoji:'🎨', desc:'Resolveu de um jeito diferente', xp:10},
  {nome:'Líder', emoji:'👑', desc:'Organizou o grupo', xp:15},
  {nome:'Persistente', emoji:'💪', desc:'Não desistiu até conseguir', xp:15}];
const TITULOS = ['Novato','Aprendiz','Explorador','Estrategista','Mestre','Lenda'];
const novoAluno = (nome, equipeId = '') => ({ id: uid(), nome, equipeId, xp: 0, moedas: 0, badges: [], cont: {}, notas: {}, obs: [], recados: [] });

function novaTurma(nome) {
  const ind = [{ id: uid(), nome: 'Entrega de trabalho', curto: 'Entregas' }, { id: uid(), nome: 'Participação em aula', curto: 'Participações' }];
  return { id: uid(), nome, alunos: [],
    equipes: EQ_PADRAO.map(e => ({ id: uid(), ...e, bonus: 0 })),
    indicadores: ind,
    regras: [],
    conc: {}, extras: [],
    presenca: {}, indPresenca: '', limiteFalta: 25, disciplinas: S.disciplinas, atrib: [], avisos: [],
    avaliacoes: [], periodo: 1, mediaMin: 6,
    acoes: [
      { id: uid(), nome: 'Participou', emoji: '🙋', xp: 2, ind: ind[1].id },
      { id: uid(), nome: 'Tarefa feita', emoji: '📘', xp: 5, ind: ind[0].id },
      { id: uid(), nome: 'Ajudou um colega', emoji: '🤝', xp: 3, ind: '' },
      { id: uid(), nome: 'Ótima ideia', emoji: '💡', xp: 4, ind: '' },
      { id: uid(), nome: 'Manteve o foco', emoji: '🎯', xp: 2, ind: '' },
      { id: uid(), nome: 'Desafio vencido', emoji: '🏆', xp: 10, ind: '' }],
    conquistas: CONQ_PADRAO.map(c => ({ id: uid(), ...c })),
    recompensas: [ {id:uid(), nome:'+0,5 ponto em avaliação', emoji:'📝', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:0.5, custo:30}, {id:uid(), nome:'+1 ponto em avaliação', emoji:'⭐', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:1, custo:50}, {id:uid(), nome:'+2 pontos em avaliação', emoji:'🏆', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:2, custo:90} ],
    resgates: [], missoes: [], log: [] };
}
/* completa turmas salvas em versões anteriores */
function migrar(t) {
  if (!t.indicadores) {
    const ind = [{ id: uid(), nome: 'Entrega de trabalho', curto: 'Entregas' }, { id: uid(), nome: 'Participação em aula', curto: 'Participações' }];
    t.indicadores = ind;
    (t.acoes || []).forEach(a => { if (/tarefa|entreg/i.test(a.nome)) a.ind = ind[0].id; else if (/particip/i.test(a.nome)) a.ind = ind[1].id; });
  }
  if (!t.regras) t.regras = [{ id: uid(), nome: 'Ponto extra', pontos: 1, req: [{ ind: t.indicadores[0].id, qtd: 5 }, { ind: (t.indicadores[1] || t.indicadores[0]).id, qtd: 8 }] }];
  t.conc = t.conc || {};
  t.extras = t.extras || [];
  t.recompensas = t.recompensas || [ {id:uid(), nome:'+0,5 ponto em avaliação', emoji:'📝', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:0.5, custo:30}, {id:uid(), nome:'+1 ponto em avaliação', emoji:'⭐', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:1, custo:50}, {id:uid(), nome:'+2 pontos em avaliação', emoji:'🏆', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:2, custo:90} ];
  /* Atualiza a antiga loja cosmética para a loja simples de pontos. */
  if ((t.recompensas || []).some(r => /Moldura especial do perfil|Título exclusivo|Escolher um desafio/.test(r.nome))) { t.recompensas = [ {id:uid(), nome:'+0,5 ponto em avaliação', emoji:'📝', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:0.5, custo:30}, {id:uid(), nome:'+1 ponto em avaliação', emoji:'⭐', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:1, custo:50}, {id:uid(), nome:'+2 pontos em avaliação', emoji:'🏆', desc:'Pontos extras aplicados pelo professor a uma avaliação ou à média do bimestre.', pontos:2, custo:90} ]; }
  (t.recompensas || []).forEach(r => { if (r.pontos == null) r.pontos = 1; });
  t.resgates = t.resgates || [];
  t.alunos.forEach(a => { if (a.moedas == null) a.moedas = 0; });
  t.regras.forEach(r => { if (!r.destino) r.destino = 'media'; if (r.moedas == null) r.moedas = 10; });
  t.extras.forEach(e => { if (!e.destino) e.destino = 'media'; });
  /* concessões antigas, de antes dos bimestres, entram como extras do 1º bimestre */
  if (!t.extrasMigrados) {
    Object.entries(t.conc).forEach(([k, ts]) => { const [aid, rid] = k.split('|'); const r = t.regras.find(x => x.id === rid); if (r && !t.extras.some(e => e.key === k)) t.extras.push({ id: uid(), a: aid, key: k, nome: r.nome, pontos: r.pontos, destino: r.destino || 'media', per: 1, ts }); });
    t.extrasMigrados = true;
  }
  t.presenca = t.presenca || {}; t.indPresenca = t.indPresenca || ''; if (t.limiteFalta == null) t.limiteFalta = 25;
  t.avaliacoes = t.avaliacoes || []; t.periodo = t.periodo || 1; if (t.mediaMin == null) t.mediaMin = 6;
  t.alunos.forEach(a => { a.cont = a.cont || {}; a.notas = a.notas || {}; a.obs = a.obs || []; a.recados = a.recados || []; });
  t.avisos = t.avisos || [];
  if (!t.disciplinas || !t.disciplinas.length) t.disciplinas = [{ id: uid(), nome: 'Geral' }];
  const d0 = t.disciplinas[0].id;
  t.avaliacoes.forEach(v => { if (!v.disc || !t.disciplinas.some(d => d.id === v.disc)) v.disc = d0; });
  t.extras.forEach(e => { if (!e.disc) { const av = e.destino && e.destino !== 'media' ? t.avaliacoes.find(v => v.id === e.destino) : null; e.disc = av ? av.disc : d0; } });
  t.regras.forEach(r => { if (!r.disc) r.disc = d0; });
  Object.keys(t.presenca).forEach(k => { const p = t.presenca[k]; if (!p.disc) { delete t.presenca[k]; p.data = p.data || k; p.disc = d0; t.presenca[p.data + '|' + d0] = p; } });
  (t.acoes || []).forEach(a => { if (a.ind === undefined) a.ind = ''; });
  (t.missoes || []).forEach(m => { if (m.ind === undefined) m.ind = ''; });
}

    t.acoes.map(a => { const i = ui.modo === 'aluno' && a.ind ? indic(t, a.ind) : null;
      return `<button class="acao" data-a="aplicar" data-id="${a.id}"><span class="e">${a.emoji}</span><span>${esc(a.nome)}</span><span class="pill ${a.xp < 0 ? 'neg' : ''}">${a.xp > 0 ? '+' : ''}${a.xp} XP</span>${i ? `<span class="sub">conta em ${esc(i.curto)}</span>` : ''}</button>`; }).join('') + '</div>';
  h += `<div class="custom"><input type="number" inputmode="numeric" id="custom" placeholder="Outro valor (ex.: 7)" value="${esc(ui.custom)}" data-c="custom"><button class="btn coin" data-a="aplicarCustom">Dar pontos</button></div>`;
  if (t.log.length) h += `<p class="muted" style="margin-top:18px">Último registro: ${esc(t.log[0].texto)} <button class="mini" data-a="desfazer">Desfazer</button></p>`;
  if (n) h += `<button class="float" data-a="irAcoes">${n} ${ui.modo === 'aluno' ? (n === 1 ? 'aluno marcado' : 'alunos marcados') : (n === 1 ? 'equipe marcada' : 'equipes marcadas')}. Escolha a ação</button>`;
  return h;
}

function vPresenca(t) {
  if (!t.alunos.length) return vazio();
  if (!ui.cham || !t.disciplinas.some(d => d.id === ui.cham.disc)) carregarCham(hoje(), discAtual(t));
  const c = ui.cham, salva = t.presenca[chamKey(c.data, c.disc)];
  const faltas = t.alunos.filter(a => c.st[a.id] === 'F').length, just = t.alunos.filter(a => c.st[a.id] === 'J').length, pres = t.alunos.length - faltas - just;
  const lista = [...t.alunos].sort(porNome);
  let h = discChips(t) + `<div class="card"><label class="f" style="margin-top:0"><span>Data da aula</span><input type="date" value="${c.data}" max="${hoje()}" data-c="chamData"></label>
    <p class="muted" style="margin-top:8px">${salva ? '✓ Chamada já salva para este dia. Você pode corrigir e salvar de novo.' : 'Chamada nova. Todos começam presentes: toque em quem faltou.'}</p></div>
    <div class="kp"><div class="k"><b>${pres}</b><span>Presentes</span></div><div class="k ${faltas ? 'warn' : ''}"><b>${faltas}</b><span>Faltas</span></div><div class="k"><b>${just}</b><span>Justificadas</span></div></div>
    <div class="chips" style="margin-bottom:12px"><button class="mini" data-a="chamTodos">Todos presentes</button></div>`;
  h += lista.map(a => {
    const s = c.st[a.id] || 'P', fq = freq(t, a, c.disc), alerta = fq.aulas > 0 && fq.pct < 100 - t.limiteFalta;
    return `<button class="pr" data-a="chamTog" data-id="${a.id}">${avatar(a, equipe(t, a.equipeId))}<span class="info"><span class="nm">${esc(a.nome)}${alerta ? `<span class="tag alerta">Freq. ${fq.pct}%</span>` : ''}</span><span class="sub">${fq.aulas ? `${fq.f} falta${fq.f === 1 ? '' : 's'} em ${fq.aulas} aula${fq.aulas === 1 ? '' : 's'}` : 'Sem chamadas ainda'}</span></span><span class="st ${s}">${s === 'P' ? 'Presente' : s === 'F' ? 'Falta' : 'Justificada'}</span></button>`;
  }).join('');
  h += `<p class="muted">Toque para alternar: Presente, Falta, Justificada. Faltas justificadas não reduzem a frequência.</p>
    <label class="f"><span>Contar presença em um indicador das metas</span><select data-c="indPres">${[['', 'Não contar'], ...t.indicadores.map(i => [i.id, i.nome])].map(o => `<option value="${o[0]}" ${o[0] === t.indPresenca ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>
    <p class="muted">Quem estiver presente ganha +1 no indicador escolhido ao salvar. Serve para metas como "presença no bimestre".</p>`;
  const regs = Object.entries(t.presenca).filter(([k, p]) => p.disc === c.disc).sort((x, y) => y[1].data.localeCompare(x[1].data)).slice(0, 10);
  if (regs.length) h += `<h2 class="sec-t">Chamadas anteriores de ${esc(discNome(t, c.disc))}</h2>` + regs.map(([k, p]) => `<div class="arow"><span class="info"><span class="nm">${dataBR(p.data)}</span><span class="sub">${p.p.length} presentes, ${p.f.length} faltas, ${p.j.length} justificadas</span></span><button class="btn sm" style="flex:none" data-a="chamAbrir" data-k="${k}">Abrir</button><button class="x" data-a="chamDel" data-k="${k}" aria-label="Excluir chamada">✕</button></div>`).join('');
  h += `<button class="float ok" data-a="chamSalvar">${salva ? 'Atualizar chamada' : 'Salvar chamada'}</button>`;
  return h;
}

function vNotas(t) {
  if (!t.alunos.length) return vazio();
  const per = ui.per || t.periodo || 1, disc = discAtual(t);
  let h = `<div class="seg">${[1, 2, 3, 4].map(p => `<button data-a="per" data-v="${p}" class="${per === p ? 'on' : ''}">${p}º bim.</button>`).join('')}</div>`;
  const avs = t.avaliacoes.filter(v => v.per === per && (v.disc || t.disciplinas[0].id) === disc);
  h += discChips(t) + `<h2 class="sec-t" style="margin-top:0">Avaliações de ${esc(discNome(t, disc))}</h2>`;
  h += avs.length ? avs.map(v => {
    const ls = t.alunos.map(a => a.notas[v.id]).filter(x => x !== undefined && x !== null);
    const med = ls.length ? ls.reduce((s, x) => s + x, 0) / ls.length : null;
    return `<div class="card"><h3><span>📝 ${esc(v.nome)}</span><span class="pill">peso ${fmt(v.peso)}</span></h3>
      <p class="muted">Vale até ${fmt(v.max)}. ${ls.length} de ${t.alunos.length} notas lançadas${med !== null ? `, média da turma ${fmt1(med)}` : ''}.</p>
      <div class="row"><button class="btn pri sm" data-a="notasLancar" data-id="${v.id}">Lançar notas</button><button class="btn sm" data-a="avalEdit" data-id="${v.id}">Editar</button></div></div>`;
  }).join('') : '<p class="muted">Nenhuma avaliação neste bimestre.</p>';
  h += `<div class="row" style="margin-top:0"><button class="btn pri" data-a="avalNova">Nova avaliação</button></div>`;
  const concessoes = t.extras.filter(e => e.per === per && (e.disc || t.disciplinas[0].id) === disc).slice().sort((a,b) => b.ts-a.ts);
  h += `<div class="card" style="border:2px solid #E7B84B;background:#FFF9E8;margin-top:12px"><h3><span class="material-symbols-rounded">stars</span> Pontos concedidos neste bimestre <span class="pill">${concessoes.length}</span></h3>` +
    (concessoes.length ? concessoes.map(e => { const a = aluno(t,e.a); return `<div class="arow"><span class="info"><span class="nm">${esc(a ? a.nome : 'Aluno removido')} · +${fmt(e.pontos)} ponto${e.pontos === 1 ? '' : 's'}</span><span class="sub">${esc(e.nome)} → ${esc(destinoNome(t,e.destino))}</span></span><button class="btn sm bad" data-a="extraDel" data-eid="${e.id}">Remover</button></div>`; }).join('') : '<p class="muted">Nenhum ponto concedido neste bimestre.</p>') + `</div>`;
  if (avs.length) {
    let rows = t.alunos.map(a => ({ a, m: mediaPer(t, a, per, disc) }));
    const comNota = rows.filter(r => r.m.fin !== null);
    const mt = comNota.length ? comNota.reduce((s, r) => s + r.m.fin, 0) / comNota.length : null;
    const abaixo = comNota.filter(r => r.m.fin < t.mediaMin).length;
    h += `<h2 class="sec-t">Médias do ${per}º bimestre</h2><div class="kp"><div class="k"><b>${mt !== null ? fmt1(mt) : '—'}</b><span>Média da turma</span></div><div class="k ${abaixo ? 'warn' : ''}"><b>${abaixo}</b><span>Abaixo de ${fmt(t.mediaMin)}</span></div></div>
      <div class="seg"><button data-a="fnota" data-v="todos" class="${ui.fnota === 'todos' ? 'on' : ''}">Todos</button><button data-a="fnota" data-v="baixo" class="${ui.fnota === 'baixo' ? 'on' : ''}">Abaixo da média</button></div>`;
    if (ui.fnota === 'baixo') rows = rows.filter(r => r.m.fin !== null && r.m.fin < t.mediaMin);
    rows.sort((x, y) => porNome(x.a, y.a));
    h += rows.map(({ a, m }) => `<button class="pr" data-a="abrirAluno" data-id="${a.id}">${avatar(a, equipe(t, a.equipeId))}<span class="info"><span class="nm">${esc(a.nome)}</span><span class="sub">${m.base === null ? 'Sem notas lançadas' : `média ${fmt1(m.base)}${m.extra ? ` + ${fmt(m.extra)} de ponto extra` : ''}, ${m.n} de ${m.total} notas`}</span></span><span class="nota ${m.fin === null ? '' : m.fin >= t.mediaMin ? 'ok' : 'bad'}">${m.fin === null ? '—' : fmt1(m.fin)}</span></button>`).join('') || '<p class="muted">Ninguém abaixo da média.</p>';
    h += `<p class="muted">Os pontos concedidos aparecem destacados no perfil e nesta tela. Se forem destinados a uma avaliação, somam à nota dela até o máximo da avaliação; se forem destinados à média, somam à média do bimestre até 10.</p>`;
  }
  return h;
}

function vRelatorio(t) {
  if (!t.alunos.length) return vazio();
  const per = t.periodo || 1;
  const rows = t.alunos.map(a => ({ a, fq: freq(t, a), m: mediaPer(t, a, per), at: atencao(t, a, per) }));
  const comAula = rows.filter(r => r.fq.aulas > 0), comNota = rows.filter(r => r.m.fin !== null);
  const fm = comAula.length ? Math.round(comAula.reduce((s, r) => s + r.fq.pct, 0) / comAula.length) : null;
  const mt = comNota.length ? comNota.reduce((s, r) => s + r.m.fin, 0) / comNota.length : null;
  const atn = rows.filter(r => r.at.length);
  let h = `<div class="kp"><div class="k"><b>${fm !== null ? fm + '%' : '—'}</b><span>Frequência média</span></div><div class="k"><b>${mt !== null ? fmt1(mt) : '—'}</b><span>Média, ${per}º bim.</span></div><div class="k ${atn.length ? 'warn' : ''}"><b>${atn.length}</b><span>Em atenção</span></div><div class="k"><b>${pendentes(t).length}</b><span>Pontos extras a conceder</span></div></div>
    <p class="muted">Em atenção: frequência abaixo de ${100 - t.limiteFalta}% ou média abaixo de ${fmt(t.mediaMin)}. Ajuste esses limites na aba Turma.</p>
    <div class="seg"><button data-a="frel" data-v="todos" class="${ui.frel === 'todos' ? 'on' : ''}">Todos</button><button data-a="frel" data-v="atencao" class="${ui.frel === 'atencao' ? 'on' : ''}">Em atenção</button></div>`;
  const l = (ui.frel === 'atencao' ? atn : rows).sort((x, y) => y.at.length - x.at.length || porNome(x.a, y.a));
  h += l.map(({ a, fq, m, at }) => { const pts = t.extras.filter(e => e.a === a.id && e.per === per && extVis(t, e)); const totalPts = pts.reduce((z,e) => z + e.pontos, 0); return `<button class="pr" data-a="abrirAluno" data-id="${a.id}">${avatar(a, equipe(t, a.equipeId))}<span class="info"><span class="nm">${esc(a.nome)}${at.length ? `<span class="tag alerta">${at.join(' e ')}</span>` : ''}</span><span class="sub">Freq. ${fq.aulas ? fq.pct + '%' : '—'}, média ${m.fin !== null ? fmt1(m.fin) : '—'}, nível ${nivel(a.xp)}${pts.length ? ` · ⭐ +${fmt(totalPts)} em pontos concedidos` : ''}</span></span><span class="xp"><b>${a.xp}</b>XP</span></button>`; }).join('') || '<p class="muted">Nenhum aluno em atenção.</p>';
  return h;
}

function vMais(t) { return vPainel(t); }

function vMetas(t) {
  const pend = pendentes(t);
  let h = `<div class="row" style="margin:0 0 14px;flex-wrap:wrap"><button class="btn pri sm" data-a="regraNova"><span class="material-symbols-rounded">add_circle</span> Criar meta nesta turma</button><button class="btn sm" data-a="indNova"><span class="material-symbols-rounded">add_circle</span> Criar indicador nesta turma</button></div>`;
  h += `<div class="card"><h3 style="margin-bottom:2px">🔓 Pontos extras a conceder</h3><p class="muted">Alunos que cumpriram todas as exigências de uma meta. Ao criar a meta, escolha se o ponto vai para a média do bimestre ou para uma avaliação específica.</p>`;
  h += pend.length ? pend.map(({ a, r }) => `<div class="arow">${avatar(a, equipe(t, a.equipeId))}<span class="info"><span class="nm">${esc(a.nome)}</span><span class="sub">${esc(r.nome)}, +${fmt(r.pontos)} ponto${r.pontos === 1 ? '' : 's'} e +${Math.max(0,Math.round(num(r.moedas)||0))} Lina Coins</span></span><button class="btn ok sm" style="flex:none" data-a="conceder" data-id="${a.id}" data-r="${r.id}">Conceder</button></div>`).join('')
    : '<p class="muted" style="margin-top:10px">Nenhum desbloqueio pendente por enquanto.</p>';
  h += '</div><h2 class="sec-t"><span class="material-symbols-rounded">track_changes</span> Metas</h2>';
  h += regrasVis(t).length ? regrasVis(t).map(r => {
    const vs = t.alunos.map(a => avaliar(t, a, r));
    return `<div class="card"><h3><span>🎯 ${esc(r.nome)}</span><span class="pill">+${fmt(r.pontos)} pt · 🪙 +${Math.max(0,Math.round(num(r.moedas)||0))}</span></h3><p class="muted">Exige ${esc(exige(t, r))}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="sp ok">${vs.filter(v => v.estado === 'disponivel').length} a conceder</span><span class="sp done">${vs.filter(v => v.estado === 'concedido').length} concedidos</span><span class="sp wip">${vs.filter(v => v.estado === 'andamento').length} em andamento</span></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-a="metaAlunos" data-id="${r.id}">Ver alunos</button><button class="btn sm" data-a="regraEdit" data-id="${r.id}">Editar</button></div></div>`;
  }).join('') : '<p class="muted">Nenhuma meta aplicada a esta turma ainda. Crie uma aqui ou use o Gerenciador de gamificação na tela inicial do professor.</p>';
  h += `<h2 class="sec-t"><span class="material-symbols-rounded">bar_chart</span> Indicadores</h2><p class="muted">Contadores usados pelas metas e pelas ações desta turma.</p><div class="card">` +
    (t.indicadores.length ? t.indicadores.map(i => { const liga = t.acoes.filter(a => a.ind === i.id).map(a => a.emoji + ' ' + a.nome); if (t.indPresenca === i.id) liga.push('📋 Presença'); return `<div class="arow"><span class="info"><span class="nm">${esc(i.nome)}</span><span class="sub">${liga.length ? 'Contado por: ' + esc(liga.join(', ')) : 'Nada ligado ainda'}</span></span><button class="btn sm" data-a="indEdit" data-id="${i.id}">Editar</button></div>`; }).join('') : '<p class="muted">Nenhum indicador aplicado a esta turma.</p>') + `</div>`;
  return h;
}

const feita = (t, m) => m.tipo === 'turma' ? m.done : (t.alunos.length > 0 && t.alunos.every(a => m.concluidas.includes(a.id)));
function vMissoes(t) {
  let h = `<div class="row" style="margin:0 0 14px;flex-wrap:wrap"><button class="btn pri sm" data-a="missaoNova"><span class="material-symbols-rounded">add_circle</span> Criar missão nesta turma</button></div><p class="muted">Você pode criar missões aqui ou no Gerenciador central. O progresso desta turma continua separado.</p>`;
  if (!t.missoes.length) return h + `<p class="muted" style="margin-top:16px">Nenhuma missão aplicada a esta turma ainda.</p>`;
  const card = m => {
    const ind = m.tipo === 'individual', f = feita(t, m), i = m.ind ? indic(t, m.ind) : null;
    return `<div class="card ${f ? 'done' : ''}"><h3><span>🗺️ ${esc(m.nome)}</span><span class="pill">+${m.xp} XP</span></h3>
      <p class="muted">${ind ? `${m.concluidas.filter(id => aluno(t, id)).length} de ${t.alunos.length} alunos concluíram` : (m.done ? 'Concluída pela turma toda' : 'Missão coletiva: todos ganham ao concluir')}${i ? `. Conta em ${esc(i.curto)}.` : ''}</p>
      ${ind ? `<span class="bar" style="margin:8px 0"><i style="width:${t.alunos.length ? m.concluidas.filter(id => aluno(t,id)).length / t.alunos.length * 100 : 0}%"></i></span>` : ''}
      ${ind && m.concluidas.filter(id => aluno(t,id)).length ? `<div class="mission-completed"><b>✅ Já concluíram (${m.concluidas.filter(id => aluno(t,id)).length})</b><div class="mission-names">${m.concluidas.filter(id => aluno(t,id)).map(id => `<span>${esc(aluno(t,id).nome)}</span>`).join('')}</div></div>` : (m.tipo === 'turma' && m.done ? `<div class="mission-completed"><b>✅ Concluída por toda a turma</b><div class="mission-names">${t.alunos.slice().sort(porNome).map(a => `<span>${esc(a.nome)}</span>`).join('')}</div></div>` : '')}
      <div class="row"><button class="btn sm" data-a="missaoEdit" data-id="${m.id}">Editar</button>${f ? '' : (ind ? `<button class="btn pri sm" data-a="missaoMarcar" data-id="${m.id}">${m.concluidas.some(id=>aluno(t,id)) ? 'Marcar mais alunos' : 'Marcar quem concluiu'}</button>` : `<button class="btn pri sm" data-a="missaoTurma" data-id="${m.id}">Concluir para a turma</button>`)}</div></div>`;
  };
  const at = t.missoes.filter(m => !feita(t, m)), fe = t.missoes.filter(m => feita(t, m));
  h += '<div style="margin-top:16px">' + at.map(card).join('') + '</div>';
  if (fe.length) h += `<h2 class="sec-t">Concluídas</h2>` + fe.map(card).join('');
  return h;
}

function vConquistas(t) {
  return `<div class="row" style="margin:0 0 14px;flex-wrap:wrap"><button class="btn pri sm" data-a="conqNova"><span class="material-symbols-rounded">add_circle</span> Criar conquista nesta turma</button></div><p class="muted">Clique em uma conquista para ver os alunos e as opções disponíveis.</p><div class="badges" style="margin-top:16px">` +
    (t.conquistas.length ? t.conquistas.map(c => `<button class="badge" data-a="conqAbrir" data-id="${c.id}"><span class="e">${c.emoji}</span><b>${esc(c.nome)}</b><span class="sub">${esc(c.desc)}</span><span class="pill">${t.alunos.filter(a => a.badges.includes(c.id)).length} alunos</span></button>`).join('') : '<p class="muted">Nenhuma conquista aplicada a esta turma ainda. Crie uma aqui ou no Gerenciador central.</p>') + '</div>';
}

function vTurma(t) {
  const opt = sel => `<option value="">Sem equipe</option>` + t.equipes.map(e => `<option value="${e.id}" ${sel === e.id ? 'selected' : ''}>${e.emoji} ${esc(e.nome)}</option>`).join('');
  return `<h2 class="sec-t" style="margin-top:0">${esc(t.nome)}</h2><p class="muted">Você leciona ${esc(discNome(t, discAtual(t)))} nesta turma. Turmas, alunos e professores são cadastrados pela administração da escola.</p>

    <h2 class="sec-t">Configurações da turma</h2><p class="muted">Estas opções valem somente para esta turma: período letivo, critérios de média e organização dos alunos.</p>
    <label class="f" style="margin-top:0"><span>Bimestre atual (pontos extras entram nele)</span><select data-c="cfgPer">${[1, 2, 3, 4].map(p => `<option value="${p}" ${p === (t.periodo || 1) ? 'selected' : ''}>${p}º bimestre</option>`).join('')}</select></label>
    <label class="f"><span>Média mínima de aprovação</span><input type="number" inputmode="decimal" step="any" value="${t.mediaMin}" data-c="cfgMed"></label>
    <label class="f"><span>Limite de faltas (% das aulas)</span><input type="number" inputmode="numeric" value="${t.limiteFalta}" data-c="cfgFalta"></label>

    <h2 class="sec-t">Alunos e equipes (${t.alunos.length})</h2>
    <div class="row" style="margin-top:0"><button class="btn" data-a="sortearEquipes">Sortear equipes</button></div>
    <div style="margin-top:10px">` +
    t.alunos.map(a => `<div class="arow">${avatar(a, equipe(t, a.equipeId))}<button class="nm x" style="text-align:left;font-size:16px;font-weight:800;color:var(--ink)" data-a="abrirAluno" data-id="${a.id}">${esc(a.nome)}</button>
      <select data-c="eqAluno" data-id="${a.id}" aria-label="Equipe de ${esc(a.nome)}">${opt(a.equipeId)}</select></div>`).join('') + `</div>

    <h2 class="sec-t">Equipes</h2>` +
    t.equipes.map(e => `<div class="arow"><span class="av" style="background:${e.cor}">${e.emoji}</span><span class="nm">${esc(e.nome)}</span><button class="btn sm" data-a="eqEdit" data-id="${e.id}">Editar</button></div>`).join('') +
    `<div class="row"><button class="btn sm" data-a="eqNova">Nova equipe</button></div>

    <h2 class="sec-t">Ações de pontuação</h2><p class="muted">São os botões da aba Pontuar. Cada ação pode contar em um indicador das metas (por exemplo, "Tarefa feita" conta em Entregas).</p>` +

function resumoTurma(t) {
  const per = t.periodo || 1;
  const ms = t.alunos.map(a => mediaPer(t, a, per).fin).filter(x => x !== null);
  const media = ms.length ? ms.reduce((s, x) => s + x, 0) / ms.length : null;

  const fm = fs.length ? Math.round(fs.reduce((s, f) => s + f.pct, 0) / fs.length) : null;

}
function mediaGeral(t) {

async function entregar(filename, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: blob }); return true; }
  } catch (e) { if (e && e.code === 'declined') return false; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true; } catch (e) { return false; }
}
function baixar(txt, nome, tipo) { entregar(nome, new Blob([txt], { type: tipo }), tipo); }

function sortear() {

/* ---------- importar alunos por planilha ---------- */
function parseCSV(text) {
  const primeira = text.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = [';', '\t', ','].map(c => [c, primeira.split(c).length]).sort((x, y) => y[1] - x[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function prepararImportacao(text) {
  const t = T(), rows = parseCSV(text.replace(/^\ufeff/, ''));
  if (!rows.length) return toast('Planilha vazia');
  const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const cab = rows[0].map(norm);
  let ci = cab.findIndex(x => ['nome', 'aluno', 'alunos', 'nome do aluno', 'estudante'].includes(x));
  const ei = cab.findIndex(x => x === 'equipe' || x === 'time');
  const temCab = ci >= 0 || ei >= 0;
  if (ci < 0) ci = 0;
  const dados = temCab ? rows.slice(1) : rows;
  const jaTem = new Set(t.alunos.map(a => norm(a.nome))), vistos = new Set(), novos = [];
  let repetidos = 0;
  dados.forEach(r => {
    const nome = String(r[ci] || '').trim().replace(/\s+/g, ' ');
    if (!nome) return;
    if (jaTem.has(norm(nome)) || vistos.has(norm(nome))) { repetidos++; return; }
    vistos.add(norm(nome));
    const eq = ei >= 0 ? t.equipes.find(e => norm(e.nome) === norm(r[ei])) : null;
    novos.push({ nome, equipeId: eq ? eq.id : '' });
  });
  if (!novos.length) return toast(repetidos ? 'Todos os nomes da planilha já estão na turma' : 'Nenhum nome encontrado na planilha');
  ui.importar = novos;
  modal(`<h2>Importar ${novos.length} aluno${novos.length === 1 ? '' : 's'}</h2><p class="muted">${repetidos ? repetidos + ' nome(s) repetido(s) foram ignorados. ' : ''}Confira a lista antes de importar.</p>` +
    `<div style="max-height:40vh;overflow:auto;margin-top:8px">${novos.slice(0, 60).map(n => `<div class="arow"><span class="nm">${esc(n.nome)}</span>${n.equipeId ? `<span class="sub">${esc(equipe(t, n.equipeId).nome)}</span>` : ''}</div>`).join('')}${novos.length > 60 ? `<p class="muted">e mais ${novos.length - 60}...</p>` : ''}</div>` +
    `<div class="row"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" data-a="importarOk">Importar</button></div>`);
}

  const ts=turmasProfessorGamificacao().filter(t=>ids.includes(t.id));
  let aplicadas=0, ignoradas=0;
  if(tipo==='indicador') {
    const curto=($('#gamCurto')?.value||'').trim()||nome;
    ts.forEach(t=>{ if(t.indicadores.some(i=>i.nome.toLowerCase()===nome.toLowerCase())) {ignoradas++;return;} t.indicadores.push({id:uid(),nome,curto}); aplicadas++; });
  } else if(tipo==='meta') {
    const inome=$('#gamInd')?.value, qtd=Math.max(1,Math.round(num($('#gamQtd')?.value))), pontos=Math.max(1,num($('#gamPontos')?.value)||1), moedas=Math.max(0,Math.round(num($('#gamMoedas')?.value)||0));
    ts.forEach(t=>{const i=t.indicadores.find(x=>x.nome===inome); if(!i){ignoradas++;return;} t.regras.push({id:uid(),nome,pontos,moedas,destino:'media',disc:discAtual(t),req:[{ind:i.id,qtd}]}); aplicadas++;});
  } else if(tipo==='missao') {
    const xp=Math.max(0,parseInt($('#gamXP')?.value,10)||0), mt=$('#gamTipo')?.value||'individual', inome=$('#gamInd')?.value||'';
    ts.forEach(t=>{const i=t.indicadores.find(x=>x.nome===inome); if(inome&&!i){ignoradas++;return;} t.missoes.push({id:uid(),nome,xp,tipo:mt,ind:i?i.id:'',concluidas:[],done:false}); aplicadas++;});
  } else if(tipo==='conquista') {
    const emoji=($('#gamEmoji')?.value||'🌟').trim(), desc=($('#gamDesc')?.value||'').trim(), xp=Math.max(0,parseInt($('#gamXP')?.value,10)||0);
    ts.forEach(t=>{if(t.conquistas.some(c=>c.nome.toLowerCase()===nome.toLowerCase())){ignoradas++;return;} t.conquistas.push({id:uid(),emoji,nome,desc,xp}); aplicadas++;});
  }
  salvar(); fechar(); ui.homeView='gerenciar'; ui.home=true; render(); toast(`${aplicadas} turma(s) receberam o item${ignoradas?`; ${ignoradas} ignorada(s) por falta de indicador ou duplicidade`:''}.`);
}

function materialMenuIcon(value) { const name = materialIconMap[String(value).trim()]; return name ? `<span class="material-symbols-rounded" aria-hidden="true">${name}</span>` : value; }
function converterIconesDeNavegacao() {
  document.querySelectorAll('.menu .e, .tile .e, #tabs .i, #studentTabs .i').forEach(el => {
    if (el.querySelector('.material-symbols-rounded')) return;
    const name = materialIconMap[el.textContent.trim()];
    if (name) { el.textContent = ''; el.classList.add('material-symbols-rounded'); el.setAttribute('aria-hidden','true'); el.textContent = name; }
  });
  // Converte apenas emojis usados como ícone de interface no início de títulos e controles.
  // Emojis de conquistas, nomes de equipes, textos do mural e campos de conteúdo são preservados.
  const alvos = 'h1,h2,h3,.sec-t,.btn,.mini,.pill,.sp,.subject,.seg button,.bl-bar button,.post-f button,.card .hd > span,.student-section > h2,.student-head > button';
  document.querySelectorAll(alvos).forEach(el => {
    if (el.closest('.badge,.badges,.sticker-card,.sticker-art,.sticker-ribbon,.student-goal-icon,.post-body,.post-caption,[data-emoji-content]')) return;
    if (el.querySelector('.material-symbols-rounded')) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (!node.nodeValue.trim()) continue;
      const m = node.nodeValue.match(/^(\s*)([\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]+(?:\uFE0F)?|✓|＋)(?=\s|$)/u);
      if (!m) break;
      const name = materialIconMap[m[2]];
      if (!name) break;
      const frag = document.createDocumentFragment();
      if (m[1]) frag.appendChild(document.createTextNode(m[1]));
      const icon = document.createElement('span'); icon.className = 'material-symbols-rounded ui-inline-icon'; icon.setAttribute('aria-hidden','true'); icon.textContent = name;
      frag.appendChild(icon);
      frag.appendChild(document.createTextNode(node.nodeValue.slice(m[0].length)));
      node.parentNode.replaceChild(frag, node);
      break;
    }
  });
}

async function otimizarFoto(file) {
  const data = await new Promise((resolve, reject) => {
    const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file);
  });
  const img = await new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = reject; im.src = data; });
  const max = 1200, scale = Math.min(1, max / Math.max(img.width, img.height));
  const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(img.width * scale)); canvas.height = Math.max(1, Math.round(img.height * scale));
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.78);
}

  postSalvar: async () => {

    const fileInput = $('#pFoto'), arquivo = fileInput && fileInput.files ? fileInput.files[0] : null;
    if (!txt && !arquivo) return toast('Escreva uma legenda ou selecione uma foto');
    const alvo = $('#pEsc').value, tipo = $('#pTipo').value, fixar = $('#pFix').value === 'sim', eu = quemSou();
    if (!escoposPublicar().some(x => x.id === alvo)) return toast('Você não pode publicar neste lugar');
    let foto = '';
    if (arquivo) {
      if (!arquivo.type.startsWith('image/')) return toast('Selecione um arquivo de imagem');
      try { foto = await otimizarFoto(arquivo); } catch (err) { return toast('Não foi possível carregar essa foto'); }
    }
    let rotulo = 'Administração';
    if (eu.role === 'prof') {
      const ds = (alvo === 'escola' ? discsDe(eu.id) : [...new Set(atribDe(eu.id).filter(x => x.t.id === alvo).map(x => x.disc))]).map(nomeDisc);
      rotulo = ds.length ? ds.join(', ') : 'Professor(a)';
    }
    S.feed.push({ id: uid(), escopo: alvo, autor: { role: eu.role, id: eu.id, nome: eu.nome, rotulo }, tipo, texto: txt, foto, t: Date.now(), fixado: fixar, likes: [] });
    salvar(); fechar(); render(); toast('Publicado no mural');

    auth.role = 'professor'; auth.profId = id; auth.alunoId = ''; auth.disc = ''; ui.home = true; ui.tab = 'painel'; render(); window.scrollTo(0, 0);
  },
  abrirDisc: d => { auth.disc = d.id; ui.home = true; render(); window.scrollTo(0, 0); },
  abrirAtalho: d => { S.atual = d.id; auth.disc = d.disc; ui.home = false; ui.tab = d.v || 'painel'; ui.cham = null; ui.sel.clear(); render(); window.scrollTo(0, 0); },
  voltarDiscs: () => { auth.disc = ''; ui.home = true; render(); window.scrollTo(0, 0); },
  loginGestao: () => { auth.role = 'gestao'; auth.profId = ''; auth.alunoId = ''; ui.gTurma = null; render(); window.scrollTo(0, 0); },
  seedDemo: () => seedDemo(),
  abrirTurma: d => { S.atual = d.id; ui.home = false; ui.tab = 'painel'; ui.cham = null; ui.sel.clear(); render(); window.scrollTo(0, 0); },
  telao: () => { ui.home = true; render(); window.scrollTo(0, 0); },

  /* gestao: turmas, professores, disciplinas */
  gTab: d => { ui.gTab = d.v; render(); },
  gAbrirTurma: d => { S.atual = d.id; ui.gTurma = d.id; ui.cham = null; render(); window.scrollTo(0, 0); },
  gVoltar: () => { ui.gTurma = null; render(); },
  gTurmaNova: () => form('Nova turma', [{ k: 'n', label: 'Nome da turma', attr: 'placeholder="Ex.: 7º B"' }], v => {
    if (!v.n) return toast('Dê um nome à turma');
    const t = novaTurma(v.n); S.turmas.push(t); S.atual = t.id; ui.gTurma = t.id; ui.cham = null; salvar(); fechar(); render();
  }, '', 'Criar'),
  turmaDel: () => confirmar(`Excluir a turma ${T().nome}? Isso apaga todos os dados dela.`, () => {
    S.turmas = S.turmas.filter(t => t.id !== S.atual); S.atual = (S.turmas[0] || {}).id || null; ui.gTurma = null; ui.cham = null; salvar(); render();
  }, 'Excluir'),
  gAtribAdd: () => {
    const t = T(), ps = $('#gProfSel'), ds = $('#gDiscSel');
    const p = S.professores.find(x => x.id === (ps ? ps.value : '')), d = S.disciplinas.find(x => x.id === (ds ? ds.value : ''));
    if (!p || !d) return toast('Escolha o professor e a disciplina');
    t.atrib = t.atrib || [];
    if (t.atrib.some(x => x.prof === p.id && x.disc === d.id)) return toast(p.nome + ' já dá ' + d.nome + ' nesta turma');
    t.atrib.push({ prof: p.id, disc: d.id }); regraPadrao(t, d.id); salvar(); render();
    toast(p.nome + ' dá ' + d.nome + ' em ' + t.nome);
  },
  gAtribDel: d => { const t = T(); t.atrib = (t.atrib || []).filter(x => !(x.prof === d.p && x.disc === d.d)); salvar(); render(); },
  gProfNovo: () => form('Novo professor', [{ k: 'n', label: 'Nome', attr: 'placeholder="Ex.: Carlos Almeida"' }],
    v => { if (!v.n) return toast('Informe o nome'); S.professores.push({ id: uid(), nome: v.n }); salvar(); fechar(); render(); }, '', 'Criar'),
  gProfEdit: d => {
    const p = S.professores.find(x => x.id === d.id);
    form('Editar professor', [{ k: 'n', label: 'Nome', v: p.nome }],
      v => { p.nome = v.n || p.nome; salvar(); fechar(); render(); },
      `<div class="row"><button class="btn sm bad" data-a="gProfDel" data-id="${p.id}">Excluir professor</button></div>`);
  },
  gProfDel: d => confirmar('Excluir este professor? Ele sai de todas as turmas. Notas e chamadas já lançadas continuam.', () => {
    S.professores = S.professores.filter(p => p.id !== d.id); S.turmas.forEach(t => { t.atrib = (t.atrib || []).filter(x => x.prof !== d.id); });
    salvar(); fechar(); render();
  }, 'Excluir'),
  gAlunoRen: d => { const a = aluno(T(), d.id); form('Editar nome', [{ k: 'n', label: 'Nome', v: a.nome }], v => { if (v.n) { a.nome = v.n; salvar(); fechar(); render(); } }); },
  gAlunoDel: d => { const a = aluno(T(), d.id); confirmar(`Remover ${a.nome}? Notas e observações dele também serão apagadas.`, () => { const t = T(); t.alunos = t.alunos.filter(x => x.id !== d.id); salvar(); fechar(); render(); }, 'Remover'); },
  gDiscNova: () => form('Nova disciplina', [{ k: 'n', label: 'Nome', attr: 'placeholder="Ex.: Matemática"' }], v => {
    if (!v.n) return toast('Dê um nome à disciplina');
    S.disciplinas.push({ id: uid(), nome: v.n }); salvar(); fechar(); render();
  }, '', 'Criar'),
  gDiscEdit: d => {
    const x = S.disciplinas.find(z => z.id === d.id);
    form('Editar disciplina', [{ k: 'n', label: 'Nome', v: x.nome }], v => { if (v.n) x.nome = v.n; salvar(); fechar(); render(); },
      S.disciplinas.length > 1 ? `<div class="row"><button class="btn sm bad" data-a="gDiscDel" data-id="${x.id}">Excluir disciplina</button></div>` : '');
  },
  gDiscDel: d => {
    if (S.turmas.some(t => (t.atrib || []).some(x => x.disc === d.id))) { fechar(); return toast('Há professores dando esta disciplina em turmas. Remova esses vínculos antes.'); }
    if (S.disciplinas.length < 2) return toast('Mantenha ao menos uma disciplina');
    confirmar('Excluir esta disciplina? As avaliações, notas e chamadas dela serão apagadas em todas as turmas.', () => {
      S.turmas.forEach(t => {
        const ids = t.avaliacoes.filter(v => v.disc === d.id).map(v => v.id);
        t.alunos.forEach(a => ids.forEach(i => delete a.notas[i]));
        t.avaliacoes = t.avaliacoes.filter(v => v.disc !== d.id);
        Object.keys(t.presenca).forEach(k => {
          const p = t.presenca[k]; if (p.disc !== d.id) return;
          if (p.ind) p.p.forEach(id => { const a = aluno(t, id); if (a) a.cont[p.ind] = Math.max(0, (a.cont[p.ind] || 0) - 1); });
          delete t.presenca[k];
        });
        t.extras.filter(e => e.disc === d.id).forEach(e => { if (e.key) delete t.conc[e.key]; });
        t.extras = t.extras.filter(e => e.disc !== d.id);
        t.regras = t.regras.filter(r => r.disc !== d.id);
        t.regras.forEach(r => { if (ids.includes(r.destino)) r.destino = 'media'; });
      });
      S.disciplinas = S.disciplinas.filter(x => x.id !== d.id); ligarDisc(); ui.cham = null;
      salvar(); fechar(); render();
    }, 'Excluir');
  },
  resetarTudo: () => confirmar('Isso apagará todas as turmas, alunos, notas, frequências, professores e registros salvos neste aplicativo. Não será possível desfazer. Deseja continuar?', () => {
    S.turmas = []; S.professores = []; S.feed = []; S.eventos = []; S.disciplinas = [{ id: uid(), nome: 'Geral' }]; S.atual = null;
    ui.sel.clear(); ui.tmp.clear(); ui.modalAluno = null; ui.modalMeta = null; ui.gTurma = null; ui.cham = null;
    salvar(); fechar(); render(); toast('Aplicativo resetado. Cadastre disciplinas, professores e turmas.');
  }, 'Apagar tudo')
};

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !H[el.dataset.a]) return;
  if (el.dataset.a === 'fecharCel' && e.target.closest('.cel')) return;
  H[el.dataset.a](el.dataset, el, e);
});
document.addEventListener('change', e => {
  const c = e.target.dataset.c, t = T(), v = e.target.value;
  if (c === 'turmaSel') { S.atual = v; ui.sel.clear(); ui.cham = null; salvar(); render(); if (!$('#modal').hidden) H.turmaLista(); }
  if (c === 'eqAluno') { aluno(t, e.target.dataset.id).equipeId = v; salvar(); render(); }
  if (c === 'chamData' && v) { carregarCham(v, ui.cham ? ui.cham.disc : discAtual(t)); render(); }
  if (c === 'indPres') { t.indPresenca = v; salvar(); render(); }
  if (c === 'globalXpAcao' || c === 'globalXpMissao' || c === 'globalXpConquista') { const cfg = configGamificacao(); const k = c === 'globalXpAcao' ? 'xpAcao' : c === 'globalXpMissao' ? 'xpMissao' : 'xpConquista'; cfg[k] = Math.max(0, Math.round(num(v))); salvar(); }
  if (c === 'cfgPer') { t.periodo = parseInt(v, 10); ui.per = null; salvar(); render(); }
  if (c === 'cfgMed') { t.mediaMin = Math.max(0, num(v)); salvar(); render(); }
  if (c === 'cfgFalta') { t.limiteFalta = Math.min(100, Math.max(0, Math.round(num(v)))); salvar(); render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.c === 'custom') ui.custom = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.telao) H.telaoFechar(); else if (!$('#modal').hidden) fechar(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('nin')) {
    e.preventDefault(); const l = [...document.querySelectorAll('.nin')], i = l.indexOf(e.target); (l[i + 1] || e.target).focus(); return;
  }
  if (e.key === 'Enter' && !$('#modal').hidden && e.target.tagName === 'INPUT' && ui.fn && e.target.type !== 'checkbox') { e.preventDefault(); ui.fn(); }
});
$('#arquivo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.turmas)) throw 0;
      S.turmas = d.turmas; S.atual = d.atual || (d.turmas[0] || {}).id || null; S.disciplinas = d.disciplinas; S.professores = d.professores; S.feed = d.feed; S.eventos = d.eventos; S.tema = d.tema; migrarGlobal(); ui.cham = null; ui.gTurma = null; salvar(); render(); toast('Backup restaurado');
    } catch (_) { toast('Arquivo inválido'); }
  };
  r.readAsText(f); e.target.value = '';
});

$('#arqAlunos').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let txt = new TextDecoder('utf-8').decode(r.result);
    if (txt.includes('\ufffd')) txt = new TextDecoder('windows-1252').decode(r.result);
    prepararImportacao(txt);
  };
  r.readAsArrayBuffer(f); e.target.value = '';
});

/* ---------- início ---------- */
(async () => {
  $('#logo').src = LOGO;
  $('#loginLogo').src = LOGO;
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.type = 'image/png'; ic.href = LOGO; document.head.appendChild(ic);
  const d = await carregar();
  if (d && Array.isArray(d.turmas)) { S.turmas = d.turmas; S.atual = d.atual; S.disciplinas = d.disciplinas || []; S.professores = d.professores || []; S.feed = d.feed || []; S.eventos = d.eventos || []; S.tema = d.tema || 'ludico'; S.gamificacaoProfessores = d.gamificacaoProfessores || {}; }
  migrarGlobal();
  if (!S.turmas.find(t => t.id === S.atual)) S.atual = (S.turmas[0] || {}).id || null;
  render();
})();
</script>
</body>
